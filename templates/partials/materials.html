<!-- SPESIFIKASI BAHAN KERTAS DENGAN THUMBNAIL REAL PNG MOCKUP -->
<div class="space-y-8">

  <!-- HEADER BAHAN KERTAS -->
  <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
        <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        Pilihan Bahan Kertas &amp; Gramasi Cetak
      </h2>
      <p class="text-xs text-slate-500 mt-1">Panduan memilih jenis kertas terbaik untuk kalender meja &amp; dinding instansi Anda.</p>
    </div>
  </div>

  <!-- GRID BAHAN KERTAS -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    {% for mat in materials %}
    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition duration-300 flex flex-col justify-between group p-5 space-y-4">
      <div class="flex items-start gap-4">
        <div class="w-24 h-24 bg-slate-900 rounded-xl overflow-hidden shrink-0 flex items-center justify-center p-1">
          <img src="{{ mat.image_url }}" alt="{{ mat.name }}" class="w-full h-full object-contain">
        </div>
        <div class="space-y-1">
          <span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
            Gramasi: {{ mat.gsm }}
          </span>
          <h3 class="font-bold text-slate-900 text-lg group-hover:text-emerald-700 transition">
            {{ mat.name }}
          </h3>
          <p class="text-xs text-slate-500 leading-relaxed">
            {{ mat.description }}
          </p>
        </div>
      </div>

      <div class="bg-slate-50 rounded-xl p-3 text-xs flex items-center justify-between">
        <span class="text-slate-500 font-medium">Cocok Untuk:</span>
        <span class="font-bold text-slate-800">{{ mat.best_for }}</span>
      </div>
    </div>
    {% endfor %}
  </div>

</div>
